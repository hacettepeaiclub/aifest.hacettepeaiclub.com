# SSL ve alan adı Nginx Proxy Manager'da; bu container yalnızca statik dosyaları sunar.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Proxy (HTTPS) arkasında /cekilis → /cekilis/ yönlendirmesi göreli olsun (http://…:80 adresine gitmesin).
    absolute_redirect off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite çıktısı içerik özetli dosya adları kullanır → uzun süre önbelleğe alınabilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Yönetim ve çekiliş sayfaları arama motorlarına kapalı.
    location ~ ^/(yonetim|cekilis)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }

    # HTML her zaman yeniden doğrulansın ki yeni sürüm hemen görünsün.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
